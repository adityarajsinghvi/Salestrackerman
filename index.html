<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesman Bonus Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e2da;--accent:#1f6f5c;--accent-ink:#fff;--danger:#b3261e;--gold:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#22221f;--ink:#f1efe8;--mute:#9b9a92;--line:#34332f;--accent:#4cc3a3;--accent-ink:#0b1f19;--danger:#ff8a80;--gold:#e0b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px;max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
main{max-width:900px;margin:0 auto;padding:0 16px 48px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,button.btn{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button.btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer;font-weight:600}
button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
button.del{background:none;border:none;color:var(--danger);cursor:pointer;font:inherit;padding:4px 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.rank{width:28px;color:var(--mute)}
.top td{font-weight:600}
.pts{font-weight:700;color:var(--accent)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:120px}
.stat b{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.empty{color:var(--mute);padding:12px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{flex:1}.row input.sm{flex:0 0 90px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🧵 Salesman Bonus Tracker</h1>
  <div style="min-width:170px"><label for="month">Month</label><input type="month" id="month"></div>
</header>
<main>
<nav id="tabs">
  <button data-t="board" class="on">Leaderboard</button>
  <button data-t="add">Add Sale</button>
  <button data-t="history">History</button>
  <button data-t="settings">Settings</button>
</nav>

<section id="board">
  <div class="card"><div class="stats" id="stats"></div></div>
  <div class="card"><h2>Leaderboard</h2><div class="wrap" id="lb"></div></div>
</section>

<section id="add" hidden>
  <div class="card">
    <h2>Record a sale</h2>
    <form id="saleForm" class="grid">
      <div><label>Salesman</label><select id="fSalesman" required></select></div>
      <div><label>Item</label><select id="fItem" required></select></div>
      <div><label>Quantity</label><input type="number" id="fQty" min="1" value="1" required></div>
      <div><label>Date</label><input type="date" id="fDate" required></div>
      <div><button class="btn" type="submit">Add sale</button></div>
    </form>
    <p id="preview" style="color:var(--mute);margin:12px 0 0"></p>
  </div>
  <div class="card"><h2>Today's entries</h2><div class="wrap" id="todayList"></div></div>
</section>

<section id="history" hidden>
  <div class="card">
    <div class="grid" style="margin-bottom:12px">
      <div><label>Filter by salesman</label><select id="hFilter"></select></div>
    </div>
    <div class="wrap" id="histList"></div>
  </div>
</section>

<section id="settings" hidden>
  <div class="card">
    <h2>Points per item</h2>
    <div id="itemRows"></div>
    <div class="row"><input id="newItem" placeholder="New item name"><input id="newPts" class="sm" type="number" placeholder="Points"><button class="btn ghost" id="addItem" style="width:auto">Add</button></div>
  </div>
  <div class="card">
    <h2>Salesmen</h2>
    <div id="manRows"></div>
    <div class="row"><input id="newMan" placeholder="New salesman name"><button class="btn ghost" id="addMan" style="width:auto">Add</button></div>
  </div>
  <div class="card">
    <h2>Bonus amount (optional)</h2>
    <label>Rupees per point (leave 0 to hide)</label>
    <input type="number" id="rate" min="0" step="any">
  </div>
  <div class="card">
    <h2>Backup</h2>
    <p style="color:var(--mute);margin-top:0">Data is saved in this browser. Download a backup regularly, and use it to move data to another phone or computer.</p>
    <div class="grid">
      <button class="btn ghost" id="expJson">Download backup (.json)</button>
      <button class="btn ghost" id="expCsv">Download sales (.csv)</button>
      <button class="btn ghost" id="impBtn">Restore backup</button>
    </div>
    <input type="file" id="impFile" accept="application/json" hidden>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY='salesman-bonus-tracker-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const defaults=()=>({
  items:[{id:uid(),name:'Pant',pts:1},{id:uid(),name:'Shirt',pts:1},{id:uid(),name:'Suit',pts:10},{id:uid(),name:'Blazer',pts:10},{id:uid(),name:'Kurta',pts:5},{id:uid(),name:'Kothi',pts:5}],
  men:Array.from({length:10},(_,i)=>({id:uid(),name:'Salesman '+(i+1)})),
  sales:[],rate:0
});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.items)db=defaults();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save – storage is blocked')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const item=id=>db.items.find(i=>i.id===id);
const man=id=>db.men.find(m=>m.id===id);
// points are snapshotted at sale time so changing rates later doesn't rewrite history
const salePts=s=>s.pts*s.qty;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

$('#month').value=today().slice(0,7);
$('#fDate').value=today();
const curMonth=()=>$('#month').value||today().slice(0,7);

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['board','add','history','settings'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t);
  render();
});
$('#month').onchange=render;

function render(){
  // selects
  const manOpts=db.men.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
  const keep=(sel,html)=>{const v=sel.value;sel.innerHTML=html;if([...sel.options].some(o=>o.value===v))sel.value=v};
  keep($('#fSalesman'),manOpts);
  keep($('#fItem'),db.items.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.pts} pt${i.pts==1?'':'s'})</option>`).join(''));
  keep($('#hFilter'),'<option value="">All salesmen</option>'+manOpts);
  renderBoard();renderToday();renderHistory();renderSettings();updatePreview();
}

function renderBoard(){
  const m=curMonth(),sales=db.sales.filter(s=>s.date.startsWith(m));
  const rows=db.men.map(p=>{
    const mine=sales.filter(s=>s.man===p.id);
    const counts={};mine.forEach(s=>counts[s.item]=(counts[s.item]||0)+s.qty);
    return{p,pts:mine.reduce((a,s)=>a+salePts(s),0),qty:mine.reduce((a,s)=>a+s.qty,0),counts};
  }).sort((a,b)=>b.pts-a.pts||a.p.name.localeCompare(b.p.name));
  const total=rows.reduce((a,r)=>a+r.pts,0),qty=rows.reduce((a,r)=>a+r.qty,0),max=Math.max(1,...rows.map(r=>r.pts));
  $('#stats').innerHTML=`<div class="stat"><b>${total}</b><span>Total points</span></div><div class="stat"><b>${qty}</b><span>Items sold</span></div>`+
    (db.rate>0?`<div class="stat"><b>₹${(total*db.rate).toLocaleString('en-IN')}</b><span>Total bonus</span></div>`:'');
  const names=db.items.map(i=>`<th class="n">${esc(i.name)}</th>`).join('');
  $('#lb').innerHTML=db.men.length?`<table><thead><tr><th class="rank">#</th><th>Salesman</th>${names}<th class="n">Points</th>${db.rate>0?'<th class="n">Bonus</th>':''}</tr></thead><tbody>`+
    rows.map((r,i)=>`<tr class="${i===0&&r.pts>0?'top':''}"><td class="rank">${i===0&&r.pts>0?'🏆':i+1}</td><td>${esc(r.p.name)}<div class="bar"><i style="width:${r.pts/max*100}%"></i></div></td>`+
      db.items.map(it=>`<td class="n">${r.counts[it.id]||'–'}</td>`).join('')+
      `<td class="n pts">${r.pts}</td>${db.rate>0?`<td class="n">₹${(r.pts*db.rate).toLocaleString('en-IN')}</td>`:''}</tr>`).join('')+'</tbody></table>'
    :'<div class="empty">No salesmen yet. Add them in Settings.</div>';
}

function saleRow(s,showDate){
  const p=man(s.man),it=item(s.item);
  return`<tr>${showDate?`<td>${s.date}</td>`:''}<td>${esc(p?p.name:'(removed)')}</td><td>${esc(s.itemName)}</td><td class="n">${s.qty}</td><td class="n pts">${salePts(s)}</td><td class="n"><button class="del" data-del="${s.id}" aria-label="Delete sale">✕</button></td></tr>`;
}
function table(rows,showDate){
  if(!rows.length)return'<div class="empty">Nothing here yet.</div>';
  return`<table><thead><tr>${showDate?'<th>Date</th>':''}<th>Salesman</th><th>Item</th><th class="n">Qty</th><th class="n">Pts</th><th></th></tr></thead><tbody>${rows.map(s=>saleRow(s,showDate)).join('')}</tbody></table>`;
}
function renderToday(){$('#todayList').innerHTML=table(db.sales.filter(s=>s.date===today()).reverse(),false)}
function renderHistory(){
  const f=$('#hFilter').value,m=curMonth();
  const rows=db.sales.filter(s=>s.date.startsWith(m)&&(!f||s.man===f)).sort((a,b)=>b.date.localeCompare(a.date)||0);
  $('#histList').innerHTML=table(rows,true);
}
$('#hFilter').onchange=renderHistory;
document.addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.del;
  if(id&&confirm('Delete this sale?')){db.sales=db.sales.filter(s=>s.id!==id);save();render();toast('Deleted')}
});

function updatePreview(){
  const it=item($('#fItem').value),q=+$('#fQty').value||0;
  $('#preview').textContent=it?`= ${it.pts*q} point${it.pts*q==1?'':'s'}`:'';
}
['fItem','fQty'].forEach(i=>$('#'+i).oninput=updatePreview);
$('#saleForm').onsubmit=e=>{
  e.preventDefault();
  const it=item($('#fItem').value),qty=Math.max(1,parseInt($('#fQty').value)||1);
  if(!it||!$('#fSalesman').value)return;
  db.sales.push({id:uid(),man:$('#fSalesman').value,item:it.id,itemName:it.name,pts:it.pts,qty,date:$('#fDate').value||today()});
  save();$('#fQty').value=1;render();
  toast(`Added ${qty} × ${it.name} → ${it.pts*qty} pts`);
};

function renderSettings(){
  if($('#settings').hidden)return;
  $('#itemRows').innerHTML=db.items.map(i=>`<div class="row"><input data-iname="${i.id}" value="${esc(i.name)}"><input class="sm" type="number" min="0" data-ipts="${i.id}" value="${i.pts}"><button class="del" data-ritem="${i.id}">Remove</button></div>`).join('');
  $('#manRows').innerHTML=db.men.map(m=>`<div class="row"><input data-mname="${m.id}" value="${esc(m.name)}"><button class="del" data-rman="${m.id}">Remove</button></div>`).join('');
  $('#rate').value=db.rate||0;
}
document.addEventListener('change',e=>{
  const d=e.target.dataset;if(!d)return;
  if(d.iname){item(d.iname).name=e.target.value.trim()||item(d.iname).name}
  else if(d.ipts){item(d.ipts).pts=Math.max(0,+e.target.value||0);toast('New rate applies to future sales only')}
  else if(d.mname){man(d.mname).name=e.target.value.trim()||man(d.mname).name}
  else return;
  save();render();
});
document.addEventListener('click',e=>{
  const d=e.target.dataset;if(!d)return;
  if(d.ritem&&confirm('Remove this item? Past sales are kept.')){db.items=db.items.filter(i=>i.id!==d.ritem);save();render()}
  if(d.rman&&confirm('Remove this salesman? Their past sales will be deleted too.')){db.men=db.men.filter(m=>m.id!==d.rman);db.sales=db.sales.filter(s=>s.man!==d.rman);save();render()}
});
$('#addItem').onclick=()=>{const n=$('#newItem').value.trim();if(!n)return;db.items.push({id:uid(),name:n,pts:Math.max(0,+$('#newPts').value||0)});$('#newItem').value=$('#newPts').value='';save();render()};
$('#addMan').onclick=()=>{const n=$('#newMan').value.trim();if(!n)return;db.men.push({id:uid(),name:n});$('#newMan').value='';save();render()};
$('#rate').onchange=e=>{db.rate=Math.max(0,+e.target.value||0);save();render()};

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#expJson').onclick=()=>download(`bonus-backup-${today()}.json`,JSON.stringify(db,null,2),'application/json');
$('#expCsv').onclick=()=>{
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['Date','Salesman','Item','Qty','Points per item','Total points'],...db.sales.map(s=>[s.date,(man(s.man)||{name:''}).name,s.itemName,s.qty,s.pts,salePts(s)])];
  download(`sales-${today()}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
};
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    const d=JSON.parse(t);
    if(!Array.isArray(d.items)||!Array.isArray(d.men)||!Array.isArray(d.sales))throw 0;
    if(!confirm('This replaces all current data with the backup. Continue?'))return;
    db=d;save();render();toast('Backup restored');
  }).catch(()=>toast('That file is not a valid backup'));
  e.target.value='';
};

render();
</script>
</body>
</html>
